{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olasubomi Williams — Portfolio</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    :root {
      --bg: #0a0a0a; --surface: #111111; --surface-2: #1a1a1a; --surface-3: #242424;
      --text: #f5f5f5; --text-muted: #888888; --accent: #2dd4bf;
      --accent-glow: rgba(45, 212, 191, 0.15); --border: #2a2a2a; --border-hover: #3a3a3a;
      --gradient-1: linear-gradient(135deg, #2dd4bf 0%, #0ea5e9 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
    .wrap { display: flex; min-height: 100vh; }
    .side { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 1.5rem; position: fixed; height: 100vh; display: flex; flex-direction: column; z-index: 100; }
    .brand { font-size: 1.75rem; font-weight: 700; color: var(--accent); margin-bottom: 3rem; }
    .brand span { color: var(--text); font-weight: 300; }
    nav { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .nav-link { padding: 0.75rem 1rem; border-radius: 0.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9375rem; font-weight: 500; transition: all .2s; cursor: pointer; border: none; background: none; text-align: left; display: block; }
    .nav-link:hover { background: var(--surface-2); color: var(--text); }
    .nav-link.active { background: var(--accent-glow); color: var(--accent); }
    .side-f { margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text-muted); }
    .main { margin-left: 260px; flex: 1; min-height: 100vh; }
    .sec { padding: 3rem; max-width: 1100px; animation: fade .4s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
    h2 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    h3 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
    .sub { color: var(--text-muted); font-size: 1.125rem; margin-bottom: 2rem; }

    /* About */
    .about-g { display: grid; grid-template-columns: 1fr 260px; gap: 3rem; align-items: start; }
    .about-t p { color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 1rem; }
    .about-t p strong { color: var(--text); }
    .photo { border-radius: 1rem; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); }
    .photo img { width: 100%; height: 300px; object-fit: cover; display: block; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .tag { padding: 0.375rem 0.875rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 2rem; font-size: 0.8125rem; color: var(--text-muted); }

    /* Software */
    .sw-cats { display: flex; flex-direction: column; gap: 2rem; }
    .sw-cat-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .sw-cat-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .sw-card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; position: relative; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .sw-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gradient-1); opacity: 0; transition: opacity 0.3s; }
    .sw-card:hover { border-color: var(--border-hover); transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5); }
    .sw-card:hover::before { opacity: 1; }
    .sw-icon-wrap { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; font-size: 1.5rem; border: 1px solid var(--border); transition: all 0.3s; }
    .sw-card:hover .sw-icon-wrap { background: var(--accent-glow); border-color: var(--accent); transform: scale(1.1); }
    .sw-name { font-weight: 600; font-size: 1rem; margin-bottom: 0.25rem; }
    .sw-desc { font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 1rem; }
    .sw-bar-bg { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
    .sw-bar-fill { height: 100%; background: var(--gradient-1); border-radius: 2px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .sw-level { display: flex; justify-content: space-between; font-size: 0.6875rem; color: var(--text-muted); margin-top: 0.375rem; }

    /* Projects */
    .proj-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .proj-card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
    .proj-card:hover { border-color: var(--border-hover); transform: translateY(-6px); box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6); }
    .proj-card.featured { grid-column: span 2; }
    .proj-visual { height: 200px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .proj-card.featured .proj-visual { height: 260px; }
    .proj-visual::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--surface) 0%, transparent 40%); }
    .proj-v-inner { font-size: 3rem; opacity: 0.15; transition: all 0.4s; }
    .proj-card:hover .proj-v-inner { opacity: 0.25; transform: scale(1.1); }
    .proj-badge { position: absolute; top: 1rem; right: 1rem; padding: 0.375rem 0.75rem; background: rgba(10,10,10,0.8); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 2rem; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; z-index: 2; }
    .proj-badge.teal { color: var(--accent); border-color: rgba(45,212,191,0.3); }
    .proj-badge.orange { color: #f59e0b; border-color: rgba(245,158,11,0.3); }
    .proj-badge.purple { color: #a78bfa; border-color: rgba(167,139,250,0.3); }
    .proj-badge.pink { color: #f472b6; border-color: rgba(244,114,182,0.3); }
    .proj-body { padding: 1.5rem; position: relative; z-index: 1; }
    .proj-body h3 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; transition: color 0.2s; }
    .proj-card:hover .proj-body h3 { color: var(--accent); }
    .proj-body p { color: var(--text-muted); font-size: 0.875rem; line-height: 1.6; margin-bottom: 1rem; }
    .proj-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; }
    .proj-tag { padding: 0.25rem 0.625rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 0.375rem; font-size: 0.6875rem; color: var(--text-muted); font-weight: 500; }

    /* Experience */
    .exp-timeline { position: relative; padding-left: 2rem; }
    .exp-timeline::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--border); }
    .exp-item { position: relative; padding-bottom: 2rem; }
    .exp-item:last-child { padding-bottom: 0; }
    .exp-dot { position: absolute; left: -2rem; top: 0.5rem; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3); border: 2px solid var(--border); transform: translateX(-5px); transition: all 0.3s; }
    .exp-item:hover .exp-dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
    .exp-card-x { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; transition: all 0.3s; }
    .exp-item:hover .exp-card-x { border-color: var(--border-hover); box-shadow: 0 16px 32px -8px rgba(0,0,0,0.4); }
    .exp-header-x { padding: 1.5rem; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; transition: background 0.2s; }
    .exp-header-x:hover { background: var(--surface-2); }
    .exp-meta { flex: 1; }
    .exp-company { font-weight: 700; font-size: 1.0625rem; margin-bottom: 0.25rem; }
    .exp-role-x { font-size: 0.875rem; color: var(--accent); font-weight: 500; margin-bottom: 0.5rem; }
    .exp-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; }
    .exp-tag { padding: 0.2rem 0.5rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 0.25rem; font-size: 0.6875rem; color: var(--text-muted); }
    .exp-toggle-x { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: var(--text-muted); transition: all 0.3s; flex-shrink: 0; margin-top: 0.25rem; }
    .exp-card-x.open .exp-toggle-x { transform: rotate(45deg); background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    .exp-body-x { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .exp-card-x.open .exp-body-x { max-height: 2000px; }
    .exp-inner-x { padding: 0 1.5rem 1.5rem; color: var(--text-muted); font-size: 0.9375rem; line-height: 1.7; }
    .exp-inner-x p { margin-bottom: 0.75rem; }
    .exp-gallery-x { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
    .exp-gallery-x img { width: 100%; height: 120px; object-fit: cover; border-radius: 0.5rem; border: 1px solid var(--border); transition: all 0.3s; cursor: pointer; }
    .exp-gallery-x img:hover { transform: scale(1.05); border-color: var(--accent); box-shadow: 0 8px 16px -4px rgba(0,0,0,0.4); }

    /* Contact */
    .con-g { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
    .con-f { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; }
    .fg { margin-bottom: 1rem; }
    .fg label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; color: var(--text-muted); }
    .fg input, .fg textarea { width: 100%; padding: 0.625rem 0.875rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text); font-family: inherit; font-size: 0.9375rem; }
    .fg input:focus, .fg textarea:focus { outline: none; border-color: var(--accent); }
    .fg textarea { resize: vertical; min-height: 100px; }
    .btn { padding: 0.625rem 1.5rem; background: var(--accent); color: var(--bg); border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .ok { background: var(--accent-glow); color: var(--accent); padding: 1rem; border-radius: 0.5rem; margin-top: 1rem; }
    .con-i p { color: var(--text-muted); margin-bottom: 0.75rem; }
    .con-i a { color: var(--accent); text-decoration: none; }
    .mb { display: none; position: fixed; top: 1rem; left: 1rem; z-index: 200; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; border-radius: 0.5rem; cursor: pointer; }

    /* Lightbox */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; align-items: center; justify-content: center; padding: 2rem; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 0.5rem; border: 1px solid var(--border); }
    .lightbox-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 2.5rem; color: var(--text); cursor: pointer; background: none; border: none; line-height: 1; }


    /* Project link button */
    .proj-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: var(--accent-glow);
      border: 1px solid rgba(45,212,191,0.3);
      border-radius: 0.5rem;
      color: var(--accent);
      font-size: 0.8125rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .proj-link:hover {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .proj-link svg { transition: transform 0.2s; }
    .proj-link:hover svg { transform: translate(2px, -2px); }

    /* Project preview images */
    .proj-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin: 1rem 0;
    }
    .proj-preview img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      transition: all 0.3s;
      cursor: pointer;
    }
    .proj-preview img:hover {
      transform: scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 8px 16px -4px rgba(0,0,0,0.4);
    }
    @media(max-width: 768px) {
      .side { transform: translateX(-100%); transition: transform .3s; }
      .side.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .mb { display: block; }
      .about-g { grid-template-columns: 1fr; }
      .con-g { grid-template-columns: 1fr; }
      .sec { padding: 2rem 1.5rem; }
      h1 { font-size: 2rem; }
      .proj-grid { grid-template-columns: 1fr; }
      .proj-card.featured { grid-column: span 1; }
    }
</style>
</head>
<body>
  <button class="mb" onclick="document.querySelector('.side').classList.toggle('open')">☰</button>
  <div class="wrap">
    <aside class="side">
      <div class="brand">Olasubomi<br /><span>Williams</span></div>
      <nav>
        <a href="/about" class="nav-link{{if eq .Active "about"}} active{{end}}" hx-get="/about" hx-target="#main" hx-swap="innerHTML" hx-push-url="true" onclick="document.querySelector('.side').classList.remove('open')">About me</a>
        <a href="/software" class="nav-link{{if eq .Active "software"}} active{{end}}" hx-get="/software" hx-target="#main" hx-swap="innerHTML" hx-push-url="true" onclick="document.querySelector('.side').classList.remove('open')">Software used</a>
        <a href="/projects" class="nav-link{{if eq .Active "projects"}} active{{end}}" hx-get="/projects" hx-target="#main" hx-swap="innerHTML" hx-push-url="true" onclick="document.querySelector('.side').classList.remove('open')">My projects</a>
        <a href="/experience" class="nav-link{{if eq .Active "experience"}} active{{end}}" hx-get="/experience" hx-target="#main" hx-swap="innerHTML" hx-push-url="true" onclick="document.querySelector('.side').classList.remove('open')">My work experience</a>
        <a href="/contact" class="nav-link{{if eq .Active "contact"}} active{{end}}" hx-get="/contact" hx-target="#main" hx-swap="innerHTML" hx-push-url="true" onclick="document.querySelector('.side').classList.remove('open')">Contact info</a>
      </nav>
      <div class="side-f">© 2026 Portfolio</div>
    </aside>
    <main id="main" class="main">
      {{.Body}}
    </main>
  </div>
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close">×</button>
    <img id="lightbox-img" src="" alt="">
  </div>
  <script>
    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }
  </script>
</body>
</html>{{end}}
